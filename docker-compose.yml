version: '3.8'

services:
  orbitaos-v6:
    image: orbitaos-v6:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING:?set DB_CONNECTION_STRING}
      - TZ=UTC
    volumes:
      - orbitaos-v6-logs:/app/logs
      - ./OrbitAOS.V6/appsettings.json:/app/appsettings.json:ro
      - ./OrbitAOS.V6/appsettings.Production.json:/app/appsettings.Production.json:ro
    restart: unless-stopped

volumes:
  orbitaos-v6-logs:
