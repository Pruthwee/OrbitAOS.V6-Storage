apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitaossmm
  namespace: orbitaossmm
  labels:
    app: orbitaossmm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orbitaossmm
  template:
    metadata:
      labels:
        app: orbitaossmm
    spec:
      containers:
        - name: orbitaossmm
          image: "{{IMAGE_URI}}"
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: orbitaossmm-secrets
                  key: connection-string
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
